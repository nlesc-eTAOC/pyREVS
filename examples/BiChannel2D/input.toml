[ams]
ntrajectories = 50
nsplititer = 1000
variant = "tams"
end_time = 20.0
target_score = 1.05

[sampler]
strategy = "ams"

[runtime]
loglevel = "INFO"
diagnostics = ['test']

[trajectory]
step_size = 0.01

[model]
inv_temperature = 3.67

[runner]
type = "asyncio"
nworkers=8

[test]
trigger_type = "score"
score_min = 0.0
score_max = 1.05
n_levels = 22

[database]
path = "./testDB.tdb"
