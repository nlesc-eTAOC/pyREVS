[ams]
ntrajectories = 20
nsplititer = 1000
variant = "tams"
end_time = 20.0
l_j = 2
target_score = 0.96

[sampler]
strategy = "ams"

[runtime]
loglevel = "INFO"
walltime = 7200.0
plot_diagnostics = true
diagnostics = ["testd"]

[trajectory]
step_size = 0.01
sparse_freq = 10

[model]
size_M = 40
size_N = 80
epsilon = 0.07
K = 7
score_method = "BaarsJCP"
edge_state_file = "stateEDGE_beta_0p1.npy"
delta_stoch = 0.05
score_time_dep = true
score_time_horizon = 20.0
score_time_scale = 0.5
step_size = 0.01

[runner]
type = "asyncio"
nworkers=2

[database]
path = "2DBoussinesq_Baars.tdb"

[testd]
type = "EveryTimeCrossing"
time_interval = 0.01
time_start = 0.005
