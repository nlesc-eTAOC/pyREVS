[ams]
ntrajectories = 20
nsplititer = 1000
variant = "tams"
end_time = 20.0
l_j = 2
target_score = 0.96

[sampler]
strategy = "ams"

[runtime]
loglevel = "INFO"
walltime = 7200.0

[trajectory]
step_size = 0.01
sparse_freq = 10

[model]
size_M = 40
size_N = 80
epsilon = 0.01
K = 7
score_method = "PODdecomp"
pod_data_file = "./POD_decomp_InstModes.nc"
pod_d0 = 1.0
score_time_dep = true
score_time_horizon = 20.0
score_time_scale = 0.5
step_size = 0.01

[runner]
type = "asyncio"
nworkers=2

[database]
path = "2DBoussinesq_POD.tdb"
